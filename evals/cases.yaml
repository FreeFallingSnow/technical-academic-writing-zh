cases:
  - id: repeated-evidence-strength
    focus: 证据强度只限定一次
    input: >-
      现有数据提示因素 A 可能影响结果。受证据范围限制，这些数据仅支持存在影响的可能性，不能确定影响程度。
    exact_output: 现有数据提示因素 A 可能影响结果。
    must_not_contain:
      - 受证据范围限制
      - 仅支持存在影响的可能性
      - 不能确定影响程度

  - id: scoped-negative-result
    focus: 范围直接写入观察结果
    input: >-
      本次检查未发现异常，现有结果不能代表未检查范围。
    exact_output: 在本次检查范围内未发现异常。
    must_not_contain:
      - 不能代表未检查范围
      - 未检查范围不存在异常

  - id: revision-trace
    focus: 修改过程不得进入正文
    input: >-
      根据审阅意见，本次修改后补充说明：参数 A 的设定值为 10。
    exact_output: 参数 A 的设定值为 10。
    must_not_contain:
      - 根据审阅意见
      - 本次修改后
      - 补充说明

  - id: redundant-negative
    focus: 双重否定改为直接表达
    input: >-
      该功能并非不能在离线状态下使用。
    exact_output: 该功能可以在离线状态下使用。
    must_not_contain:
      - 并非不能

  - id: meaningful-prohibition
    focus: 保留安全禁令
    input: >-
      设备运行期间不得打开防护盖。
    exact_output: 设备运行期间不得打开防护盖。
    must_preserve:
      - 禁止在设备运行期间打开防护盖

  - id: cross-level-duplication
    focus: 一个信息只设一个主要落点
    input:
      body: 在相同条件下，方案 A 的结果为 10，方案 B 的结果为 12，因此方案 B 比方案 A 高 2。
      conclusion: 在相同条件下，方案 A 的结果为 10，方案 B 的结果为 12，因此方案 B 比方案 A 高 2。
    expected_output:
      body: 在相同条件下，方案 A 的结果为 10，方案 B 的结果为 12，因此方案 B 比方案 A 高 2。
      conclusion: 相同条件下，方案 B 的结果高于方案 A。
    must_not_repeat_in_conclusion:
      - 方案 A 的结果为 10
      - 方案 B 的结果为 12
      - 高 2

  - id: hard-to-read-sentence
    focus: 难读句必须重组
    input: >-
      在输入条件发生变化并且系统完成更新以后由于响应值随之下降因此在超过预设持续时间的情况下触发了报警这一结果说明当前设置需要进一步检查。
    exact_output: >-
      输入条件发生变化后，系统完成更新，响应值随之下降。响应值下降持续超过预设时间后，系统触发报警。结果表明，当前设置需要进一步检查。
    must_preserve:
      - 输入条件先发生变化
      - 系统随后完成更新
      - 响应值下降持续超过预设时间后触发报警
      - 当前设置需要进一步检查

  - id: no-editorial-wrapper
    focus: 只输出可直接使用的正文
    task: 将“该功能并非不能启用”改为直接表达
    exact_output: 该功能可以启用。
    must_not_contain:
      - 已优化
      - 修改如下
      - 规范写法
      - 说明

  - id: local-edit-scope
    focus: 不扩展修改范围
    task: 仅将第二段第一句“该功能并非不能启用”改为直接表达
    expected_change: 第二段第一句改为“该功能可以启用”
    must_not_change:
      - 第一段
      - 第二段其他句子
      - 其他章节

  - id: paragraph-ending-priority
    focus: 段落末句加强检索
    input:
      paragraph:
        - 现有数据提示因素 A 可能影响结果。
        - 受证据范围限制，这些数据仅支持存在影响的可能性。
      next_paragraph_first_sentence: 后续分析采用相同数据范围。
    must_flag:
      - paragraph_sentence_2
    expected_output:
      paragraph:
        - 现有数据提示因素 A 可能影响结果。
    must_not_contain:
      - 受证据范围限制
      - 仅支持存在影响的可能性

  - id: suspicious-structure-retrieval
    focus: 可疑词与结构联合筛选
    input:
      - 参数 A 的设定值为 10。
      - 根据审阅意见，本次修改后补充说明：参数 B 的设定值为 20。
      - 在条件变化并且系统完成更新以后由于响应值下降因此触发报警。
    must_flag:
      - sentence_2
      - sentence_3
    trigger_reasons:
      sentence_2:
        - 修改过程词
      sentence_3:
        - 条件、过程、结果和多个连接词位于同一句

  - id: keyword-is-not-deletion-rule
    focus: 可疑词只定位候选
    input: 设备运行期间不得打开防护盖。
    must_flag_for_review: true
    exact_output: 设备运行期间不得打开防护盖。
    reason_to_keep: 否定表达构成安全禁令
